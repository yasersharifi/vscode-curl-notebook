<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="vscode-curl-notebook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- rounded tile background -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- open notebook: left page -->
  <path
    fill="url(#page)"
    stroke="#94a3b8"
    stroke-width="1.5"
    d="M22 28c0-4 3-7 8-7h34v88H30c-5 0-8-3-8-7V28z"
  />
  <!-- spine shadow -->
  <path fill="#cbd5e1" d="M56 21v94h3V21z"/>
  <!-- right page (open) -->
  <path
    fill="#ffffff"
    stroke="#94a3b8"
    stroke-width="1.5"
    d="M59 21h37c5 0 8 3 8 7v74c0 4-3 7-8 7H59V21z"
  />

  <!-- page lines (left) -->
  <rect x="30" y="38" width="20" height="2.5" rx="1.2" fill="#cbd5e1"/>
  <rect x="30" y="46" width="16" height="2.5" rx="1.2" fill="#cbd5e1"/>
  <rect x="30" y="54" width="18" height="2.5" rx="1.2" fill="#cbd5e1"/>

  <!-- CURL on right page -->
  <text
    x="64"
    y="72"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="22"
    font-weight="700"
    letter-spacing="1"
    fill="#0369a1"
  >CURL</text>

  <!-- curl arrow accent -->
  <path
    fill="none"
    stroke="#0ea5e9"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M68 82h28M88 74l8 8-8 8"
  />
</svg>
